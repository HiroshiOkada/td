<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free-Placement Tower Defense</title>
<style>
  :root { --bg:#111827; --panel:#1f2937; --panel2:#374151; --text:#f9fafb; --muted:#cbd5e1; --accent:#60a5fa; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(circle at top left,#1f2937 0,#0f172a 48%,#020617 100%); color:var(--text); }
  .wrap { width:min(1180px,100vw); margin:0 auto; padding:14px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
  h1 { margin:0; font-size:20px; letter-spacing:.03em; }
  .sub { color:var(--muted); font-size:13px; }
  .game { display:grid; grid-template-columns:minmax(0,896px) 250px; gap:12px; align-items:start; }
  canvas { width:100%; max-width:896px; height:auto; border-radius:14px; background:#0b1220; box-shadow:0 12px 30px rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.08); image-rendering:crisp-edges; cursor:crosshair; touch-action:none; }
  aside { background:rgba(31,41,55,.92); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:12px; box-shadow:0 12px 30px rgba(0,0,0,.28); }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
  .stat { background:rgba(55,65,81,.85); border-radius:10px; padding:8px; min-height:48px; }
  .label { display:block; font-size:11px; color:var(--muted); margin-bottom:2px; }
  .value { font-size:19px; font-weight:700; }
  .tower-list { display:grid; gap:8px; margin-bottom:12px; }
  button { appearance:none; border:0; border-radius:10px; background:var(--panel2); color:var(--text); padding:9px 10px; font:inherit; cursor:pointer; transition:transform .05s ease,filter .15s ease,background .15s ease; }
  button:hover { filter:brightness(1.08); }
  button:active { transform:translateY(1px); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .towerBtn { display:grid; grid-template-columns:30px 1fr auto; gap:8px; align-items:center; text-align:left; }
  .towerBtn.selected { outline:2px solid var(--accent); background:#1d4ed8; }
  .swatch { width:22px; height:22px; border-radius:999px; border:2px solid rgba(255,255,255,.6); box-shadow:inset 0 -4px 8px rgba(0,0,0,.25); }
  .small { color:var(--muted); font-size:12px; }
  .cost { font-weight:700; color:#fde68a; }
  .controls { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
  .controls .wide { grid-column:1 / -1; }
  .info { background:rgba(15,23,42,.75); border-radius:12px; padding:10px; min-height:126px; font-size:13px; line-height:1.45; color:var(--muted); }
  .info b { color:var(--text); }
  .msg { margin-top:10px; color:#bfdbfe; min-height:38px; font-size:13px; line-height:1.4; }
  kbd { background:#0f172a; border:1px solid #475569; border-bottom-width:2px; border-radius:5px; padding:1px 5px; font-size:11px; color:#e2e8f0; }
  footer { color:#94a3b8; font-size:12px; line-height:1.5; margin-top:10px; }
  @media (max-width:980px) { .game { grid-template-columns:1fr; } aside { max-width:896px; } header { align-items:flex-start; flex-direction:column; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Free-Placement Tower Defense</h1></div>
    <div class="sub">操作: <kbd>1</kbd>〜<kbd>4</kbd> タワー選択 / <kbd>N</kbd> 次Wave / <kbd>Space</kbd> 一時停止 / <kbd>U</kbd> 強化 / <kbd>S</kbd> 売却</div>
  </header>
  <div class="game">
    <canvas id="gameCanvas" aria-label="tower defense game field"></canvas>
    <aside>
      <div class="stats">
        <div class="stat"><span class="label">資金</span><span id="money" class="value">0</span></div>
        <div class="stat"><span class="label">ライフ</span><span id="lives" class="value">0</span></div>
        <div class="stat"><span class="label">Wave</span><span id="wave" class="value">0</span></div>
        <div class="stat"><span class="label">スコア</span><span id="score" class="value">0</span></div>
      </div>
      <div class="tower-list" id="towerList"></div>
      <div class="controls">
        <button id="startBtn" class="wide">次の Wave</button><button id="pauseBtn">一時停止</button><button id="speedBtn">速度 x1</button><button id="upgradeBtn">強化</button><button id="sellBtn">売却</button><button id="volumeBtn">音量: ON</button><button id="pathBtn">経路: ON</button><button id="resetBtn" class="wide">リセット</button>
      </div>
      <div class="info" id="info"></div><div class="msg" id="message"></div>
    </aside>
  </div>
  <footer>敵の入口は左、拠点は右。道を完全に塞ぐ配置はできません。装甲敵はダメージを軽減し、再生敵は時間経過で回復します。</footer>
</div>
<script>
(() => {
  "use strict";
  const CELL = 32, COLS = 28, ROWS = 18, W = COLS * CELL, H = ROWS * CELL;
  const canvas = document.getElementById("gameCanvas"), ctx = canvas.getContext("2d");
  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.width = W + "px"; canvas.style.height = H + "px"; ctx.setTransform(dpr,0,0,dpr,0,0);
  const el = { money:q("money"), lives:q("lives"), wave:q("wave"), score:q("score"), towerList:q("towerList"), startBtn:q("startBtn"), pauseBtn:q("pauseBtn"), speedBtn:q("speedBtn"), volumeBtn:q("volumeBtn"), upgradeBtn:q("upgradeBtn"), sellBtn:q("sellBtn"), pathBtn:q("pathBtn"), resetBtn:q("resetBtn"), info:q("info"), message:q("message") };

  class SoundEffects {

        }
        case "sell": {
          const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.type = "triangle"; osc.frequency.setValueAtTime(784, now);
          osc.frequency.exponentialRampToValueAtTime(392, now + 0.12);
          gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.start(now); osc.stop(now + 0.12);
          break;
        }
        case "upgrade": {
          const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.type = "sine";
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.06);
          osc.frequency.setValueAtTime(783.99, now + 0.12);
          osc.frequency.setValueAtTime(1046.50, now + 0.18);
          gain.gain.setValueAtTime(0.1, now); gain.gain.setValueAtTime(0.1, now + 0.18);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
          osc.start(now); osc.stop(now + 0.28);
          break;
        }
        case "arrow": {
          const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.type = "triangle"; osc.frequency.setValueAtTime(550, now);
          osc.frequency.exponentialRampToValueAtTime(150, now + 0.07);
          gain.gain.setValueAtTime(0.06, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.07);
          osc.start(now); osc.stop(now + 0.07);
          break;
        }
        case "cannon": {
          const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();

          osc.type = "sawtooth"; osc.frequency.setValueAtTime(100, now);
          osc.frequency.exponentialRampToValueAtTime(30, now + 0.22);
          gain.gain.setValueAtTime(0.18, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
          osc.start(now); osc.stop(now + 0.22);
          break;
        }
        case "frost": {
          const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.type = "sine"; osc.frequency.setValueAtTime(987.77, now);
          osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.12);
          gain.gain.setValueAtTime(0.06, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.start(now); osc.stop(now + 0.12);
          break;
        }
        case "laser": {
          const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.type = "sawtooth"; osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(60, now + 0.38);
          gain.gain.setValueAtTime(0.24, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.38);
          osc.start(now); osc.stop(now + 0.38);

        }
        case "defeat": {
          const osc1 = this.ctx.createOscillator(), osc2 = this.ctx.createOscillator(), gain = this.ctx.createGain();

          osc1.type = "sine"; osc2.type = "sine";
          osc1.frequency.setValueAtTime(988, now); osc1.frequency.setValueAtTime(1318, now + 0.06);
          osc2.frequency.setValueAtTime(1175, now); osc2.frequency.setValueAtTime(1568, now + 0.06);
          gain.gain.setValueAtTime(0.06, now); gain.gain.setValueAtTime(0.06, now + 0.06);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

        }
        case "hit": {
          const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.type = "sawtooth"; osc.frequency.setValueAtTime(130, now);
          osc.frequency.linearRampToValueAtTime(80, now + 0.18);
          gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
          osc.start(now); osc.stop(now + 0.18);
          break;
        }
        case "wavestart": {
          const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.type = "sine";
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          osc.frequency.setValueAtTime(523.25, now + 0.2);
          gain.gain.setValueAtTime(0.08, now); gain.gain.setValueAtTime(0.08, now + 0.2);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.38);
          osc.start(now); osc.stop(now + 0.38);
          break;
        }
        case "waveclear": {
          const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.type = "triangle";
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          osc.frequency.setValueAtTime(783.99, now + 0.16);
          osc.frequency.setValueAtTime(1046.50, now + 0.24);
          gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
          osc.start(now); osc.stop(now + 0.5);
          break;
        }
        case "gameover": {
          const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(392.00, now);
          osc.frequency.setValueAtTime(349.23, now + 0.2);
          osc.frequency.setValueAtTime(311.13, now + 0.4);
          osc.frequency.setValueAtTime(261.63, now + 0.6);
          gain.gain.setValueAtTime(0.12, now); gain.gain.setValueAtTime(0.12, now + 0.6);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 1.0);
          osc.start(now); osc.stop(now + 1.0);
          break;
        }
      }
    }
  }
  const sfx = new SoundEffects();

  const TOWER_TYPES = {
    arrow:{key:"arrow",hotkey:"1",name:"アロー",cost:50,range:112,damage:14,cooldown:.66,projectileSpeed:380,splash:0,color:"#38bdf8",desc:"安価で扱いやすい単体攻撃。序盤の主力。"},
    cannon:{key:"cannon",hotkey:"2",name:"キャノン",cost:90,range:100,damage:27,cooldown:1.35,projectileSpeed:260,splash:42,color:"#fb923c",desc:"着弾地点の周囲に範囲ダメージ。密集に強い。"},
    frost:{key:"frost",hotkey:"3",name:"フロスト",cost:80,range:94,damage:3,cooldown:.86,projectileSpeed:330,splash:0,slow:.55,slowTime:1.30,color:"#a78bfa",desc:"低ダメージだが敵を遅くする。曲がり角付近が有効。"},
    laser:{key:"laser",hotkey:"4",name:"レーザー",cost:135,range:180,damage:120,cooldown:2.8,beam:true,splash:0,color:"#f43f5e",desc:"一直線上の敵全員を貫通する極太ビーム。発射に時間がかかるが一撃必殺。"}
  };
  const typeOrder = ["arrow","cannon","frost","laser"], startCell={c:0,r:Math.floor(ROWS/2)}, goalCell={c:COLS-1,r:Math.floor(ROWS/2)};
  const state = { money:160,lives:14,score:0,wave:0,enemies:[],towers:[],projectiles:[],effects:[],selectedType:"arrow",selectedTower:null,hoverCell:null,globalPath:[],showPath:true,paused:false,gameSpeed:1,waveActive:false,waveToSpawn:0,waveSpawned:0,spawnTimer:0,time:0,gameOver:false,message:"ゲームを開始しました。タワーを配置して防衛を開始してください。",muted:false };
  const keyOf=(c,r)=>c+","+r, sameCell=(a,b)=>a.c===b.c&&a.r===b.r, centerOf=cell=>({x:cell.c*CELL+CELL/2,y:cell.r*CELL+CELL/2}), inBounds=(c,r)=>c>=0&&r>=0&&c<COLS&&r<ROWS, clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
  function cellFromPoint(x,y){return {c:Math.floor(x/CELL),r:Math.floor(y/CELL)};}
  function towerAt(c,r){return state.towers.find(t=>t.c===c&&t.r===r)||null;}
  function isBlocked(c,r,extra=null){ if(!inBounds(c,r)) return true; if(extra&&keyOf(c,r)===extra) return true; return !!towerAt(c,r); }
  function heuristic(a,b){return Math.abs(a.c-b.c)+Math.abs(a.r-b.r);}
  function findPath(start,goal,extra=null){
    if(!inBounds(start.c,start.r)||!inBounds(goal.c,goal.r)) return null;
    const open=[{c:start.c,r:start.r,f:heuristic(start,goal)}], came=new Map(), g=new Map();
    const sk=keyOf(start.c,start.r), gk=keyOf(goal.c,goal.r); g.set(sk,0);
    while(open.length){
      open.sort((a,b)=>a.f-b.f); const cur=open.shift(), ck=keyOf(cur.c,cur.r);
      if(ck===gk){ const path=[{c:cur.c,r:cur.r}]; let k=ck; while(came.has(k)){ const p=came.get(k); path.push(p); k=keyOf(p.c,p.r); } return path.reverse(); }
      for(const n of [{c:cur.c+1,r:cur.r},{c:cur.c-1,r:cur.r},{c:cur.c,r:cur.r+1},{c:cur.c,r:cur.r-1}]){
        const nk=keyOf(n.c,n.r), endpoint=nk===sk||nk===gk; if(!endpoint&&isBlocked(n.c,n.r,extra)) continue;
        const tentative=(g.get(ck)??Infinity)+1; if(tentative<(g.get(nk)??Infinity)){ came.set(nk,{c:cur.c,r:cur.r}); g.set(nk,tentative); const f=tentative+heuristic(n,goal); if(!open.some(o=>o.c===n.c&&o.r===n.r)) open.push({c:n.c,r:n.r,f}); }
      }
    }
    return null;
  }
  function enemyCell(e){ return {c:clamp(Math.floor(e.x/CELL),0,COLS-1), r:clamp(Math.floor(e.y/CELL),0,ROWS-1)}; }
  function recalcPaths(){ state.globalPath=findPath(startCell,goalCell)||[]; for(const e of state.enemies){e.path=null;e.pathIndex=0;} }
  function canPlace(cell){
    if(!cell||!inBounds(cell.c,cell.r)) return {ok:false,reason:"フィールド外です。"};
    if(sameCell(cell,startCell)) return {ok:false,reason:"入口には配置できません。"};
    if(sameCell(cell,goalCell)) return {ok:false,reason:"拠点には配置できません。"};
    if(towerAt(cell.c,cell.r)) return {ok:false,reason:"すでにタワーがあります。"};
    const type=TOWER_TYPES[state.selectedType]; if(state.money<type.cost) return {ok:false,reason:"資金が足りません。"};
    const cen=centerOf(cell); for(const e of state.enemies){ if(!e.dead&&Math.hypot(e.x-cen.x,e.y-cen.y)<CELL*.72) return {ok:false,reason:"敵が近すぎます。"}; }
    const extra=keyOf(cell.c,cell.r); if(!findPath(startCell,goalCell,extra)) return {ok:false,reason:"道を完全に塞ぐ配置はできません。"};
    for(const e of state.enemies){ if(e.dead) continue; const ec=enemyCell(e); if(ec.c===cell.c&&ec.r===cell.r) return {ok:false,reason:"敵のいるマスには配置できません。"}; if(!findPath(ec,goalCell,extra)) return {ok:false,reason:"現在いる敵が閉じ込められるため配置できません。"}; }
    return {ok:true,reason:""};
  }
  function getTowerStats(t){ const b=TOWER_TYPES[t.type], lv=t.level-1; return {range:b.range+lv*15,damage:Math.round(b.damage*Math.pow(1.85,lv)),cooldown:Math.max(.05,b.cooldown*Math.pow(0.78,lv)),projectileSpeed:b.projectileSpeed||0,splash:b.splash?Math.round(b.splash*Math.pow(1.2,lv)):0,slow:b.slow?Math.max(.25,b.slow-lv*.05):0,slowTime:b.slowTime?b.slowTime+lv*.25:0,beam:!!b.beam,color:b.color}; }
  function upgradeCost(t){return Math.floor(TOWER_TYPES[t.type].cost*(1.0+t.level*.65));}
  function sellValue(t){return Math.floor(t.spent*.55);}
  function cryptoRandomId(){ if(window.crypto&&crypto.getRandomValues){const a=new Uint32Array(1);crypto.getRandomValues(a);return String(a[0]);} return String(Math.random()).slice(2); }
  function placeTower(cell){ const v=canPlace(cell); if(!v.ok){setMessage(v.reason);return false;} const type=TOWER_TYPES[state.selectedType], t={id:cryptoRandomId(),type:type.key,c:cell.c,r:cell.r,level:1,cooldown:0,spent:type.cost}; state.money-=type.cost; state.towers.push(t); state.selectedTower=t; recalcPaths(); setMessage(type.name+"を配置しました。"); sfx.play("place"); updateUI(); return true; }
  function upgradeSelected(){ const t=state.selectedTower; if(!t) return; if(t.level>=4){setMessage("このタワーは最大レベルです。");return;} const cost=upgradeCost(t); if(state.money<cost){setMessage("強化する資金が足りません。");return;} state.money-=cost; t.spent+=cost; t.level++; setMessage(TOWER_TYPES[t.type].name+"を Lv."+t.level+" に強化しました。"); sfx.play("upgrade"); updateUI(); }

  el.startBtn.addEventListener("click",startWave); el.pauseBtn.addEventListener("click",()=>{state.paused=!state.paused;updateUI();}); el.speedBtn.addEventListener("click",()=>{state.gameSpeed=state.gameSpeed===1?2:(state.gameSpeed===2?3:1);updateUI();}); el.volumeBtn.addEventListener("click",()=>{state.muted=!state.muted;sfx.init();updateUI();}); el.pathBtn.addEventListener("click",()=>{state.showPath=!state.showPath;updateUI();}); el.upgradeBtn.addEventListener("click",upgradeSelected); el.sellBtn.addEventListener("click",sellSelected); el.resetBtn.addEventListener("click",resetGame);
  document.addEventListener("keydown",ev=>{ if(ev.target&&["INPUT","TEXTAREA","SELECT"].includes(ev.target.tagName)) return; sfx.init(); if(ev.key>="1"&&ev.key<="4"){ const key=typeOrder[Number(ev.key)-1]; state.selectedType=key; state.selectedTower=null; updateUI(); return; } const k=ev.key.toLowerCase(); if(k==="n") startWave(); if(k==="u") upgradeSelected(); if(k==="s") sellSelected(); if(k==="p"){state.showPath=!state.showPath;updateUI();} if(k==="escape"){state.selectedTower=null;updateUI();} if(ev.code==="Space"){ev.preventDefault();state.paused=!state.paused;updateUI();} });
  function resetGame(){ state.money=160;state.lives=14;state.score=0;state.wave=0;state.enemies=[];state.towers=[];state.projectiles=[];state.effects=[];state.selectedType="arrow";state.selectedTower=null;state.hoverCell=null;state.paused=false;state.gameSpeed=1;state.waveActive=false;state.waveToSpawn=0;state.waveSpawned=0;state.spawnTimer=0;state.time=0;state.gameOver=false;recalcPaths();setMessage("ゲームをリセットしました。");updateUI(); }
  let last=performance.now(); function loop(now){ const raw=Math.min(.05,(now-last)/1000); last=now; update(raw*state.gameSpeed); draw(); requestAnimationFrame(loop); }
  buildTowerButtons(); recalcPaths(); updateUI(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
